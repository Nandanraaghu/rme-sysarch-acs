name: Sync RME checklist CSV to RST

on:
  workflow_dispatch:
  push:
    paths:
      - Docs/Arm_RME_System_ACS_Testcase_Checklist.csv
      - Docs/Arm_RME_System_ACS_Testcase_Checklist.rst
      - .github/workflows/csv-to-rst.yml

permissions:
  contents: write

jobs:
  sync-rst:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate checklist table in RST
        run: |
          python3 <<'PY'
          import csv
          import io
          from pathlib import Path

          csv_path = Path('Docs/Arm_RME_System_ACS_Testcase_Checklist.csv')
          rst_path = Path('Docs/Arm_RME_System_ACS_Testcase_Checklist.rst')
          columns = ['Sl No', 'Rule ID', 'Rule Description', 'Status', 'Notes']
          start = '.. checklist-table-start'
          end = '.. checklist-table-end'

          with csv_path.open(encoding='utf-8', newline='') as csv_file:
              reader = csv.DictReader(csv_file)
              if reader.fieldnames != columns:
                  raise SystemExit(f'Unexpected CSV columns: {reader.fieldnames}')
              rows = list(reader)

          def csv_rst_line(values):
              buf = io.StringIO()
              writer = csv.writer(buf, lineterminator='')
              writer.writerow(values)
              return '   ' + buf.getvalue()

          generated = [
              start,
              '',
              '.. csv-table:: RME ACS Issue C.a Rule Checklist',
              '   :header: "Sl No", "Rule ID", "Rule Description", "Status", "Notes"',
              '   :widths: 8, 14, 48, 18, 36',
              '',
          ]
          generated.extend(csv_rst_line([row[col] for col in columns]) for row in rows)
          generated.extend(['', end])
          generated_text = '\n'.join(generated) + '\n'

          rst_text = rst_path.read_text(encoding='utf-8')
          if start in rst_text and end in rst_text:
              prefix = rst_text.split(start, 1)[0]
              suffix = rst_text.split(end, 1)[1]
              rst_text = prefix + generated_text + suffix
          else:
              rst_text = rst_text.rstrip() + '\n\n' + generated_text

          rst_path.write_text(rst_text, encoding='utf-8')
          PY

      - name: Commit updated RST
        run: |
          if [ -z "$(git status --porcelain -- Docs/Arm_RME_System_ACS_Testcase_Checklist.rst)" ]; then
            echo "Generated RST is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Docs/Arm_RME_System_ACS_Testcase_Checklist.rst
          git commit -m "docs: sync RME checklist RST from CSV [skip ci]"
          git push
